<div class="messages" role="log" aria-label="Conversation transcript" aria-live="polite">
  @for (message of messages(); track $index) {
    <div [class]="bubbleClass(message.role)" [class.excluded]="message.excludedFromContext" [attr.title]="bubbleTitle(message)" [innerHTML]="rendered(message.content)"></div>
    @if (message.attachments?.length) {
      <app-message-attachments
        class="message-attachments"
        [class.user]="message.role === 'user'"
        [attachments]="message.attachments ?? []"
      />
    }
  }
  @if (visiblePending()) {
    <div class="message assistant" [class.typing]="pendingTyping()">{{ pendingText() }}</div>
  }
</div>
